<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>H3案｜写真主役・全幅アーチ｜ESL club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#000000;
  --ink2:#333333;
  --paper:#FFFFFF;
  --paper2:#F8F8F8;
  --line:#E3E3E3;
  --green:#00B220;
  --green-h:#05A81F;
  --green-l:#EAF7EC;
  --orange:#FF9301;
  --marker:#FFE95C;
  --e:cubic-bezier(.23,1,.32,1);
}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{
  margin:0;
  font-family:"Noto Sans JP","Helvetica Neue",Helvetica,"Hiragino Sans","Hiragino Kaku Gothic ProN",Arial,"Yu Gothic",Meiryo,sans-serif;
  color:var(--ink);
  background:var(--paper);
  line-height:1.9;
  -webkit-font-smoothing:antialiased;
}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.wrap{width:100%;max-width:1240px;margin:0 auto;padding:0 20px}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px}

/* ---------- header ---------- */
.hd{position:sticky;top:0;z-index:50;background:var(--paper);border-bottom:1px solid var(--line)}
.hd-in{display:flex;align-items:center;justify-content:space-between;gap:12px;height:72px}
.hd-logo img{height:30px;width:auto}

/* ---------- button ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--green);color:#FFFFFF;font-weight:700;
  border-radius:6px;letter-spacing:.02em;line-height:1.4;text-align:center;
  transition:background .2s var(--e),transform .12s var(--e);
}
.btn:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){
  .btn:hover{background:var(--green-h)}
}
.hd .btn{padding:11px 18px;font-size:13.5px}
.btn-lg{padding:20px 46px;font-size:18px;min-width:340px}

/* ---------- hero ---------- */
.hero{position:relative;padding:42px 0 60px;background:linear-gradient(var(--paper) 0 34%,var(--paper2) 34% 100%)}
.hero-in{display:flex;flex-direction:column;align-items:center;text-align:center}
.rule{width:34px;height:3px;background:var(--orange);border-radius:2px;margin:0 0 18px}
.lead{margin:0 0 14px;font-size:15px;font-weight:700;color:var(--ink2);letter-spacing:.02em;line-height:1.8}
h1{
  margin:0;max-width:940px;
  font-size:clamp(25px,2.85vw,39px);font-weight:900;line-height:1.5;letter-spacing:.005em;
  text-wrap:balance;
}
h1 .mk{background:linear-gradient(transparent 62%,var(--marker) 62%);padding:0 .05em}
.nb{white-space:nowrap}

/* ---------- 主役の写真（全幅アーチ） ---------- */
.kv{position:relative;width:100%;max-width:1200px;margin:34px auto 0}
.kv::before{
  content:"";position:absolute;left:-12px;right:-12px;top:-12px;bottom:0;
  background:var(--green-l);
  border-radius:50% 50% 12px 12px / 24% 24% 12px 12px;
  z-index:0;
}
.kv-fig{
  position:relative;z-index:1;margin:0;overflow:hidden;background:var(--paper2);
  height:clamp(520px,46vw,600px);
  border-radius:50% 50% 12px 12px / 24% 24% 12px 12px;
}
.kv-fig img{width:100%;height:100%;object-fit:cover;object-position:50% 6%}

/* ---------- CTA ---------- */
.cta{display:flex;flex-direction:column;align-items:center;margin-top:34px}
.note{margin:14px 0 0;font-size:13.5px;color:var(--ink2);line-height:1.8}

/* ---------- entrance orchestration ---------- */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes reveal{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
.an{opacity:0;animation:rise .28s var(--e) forwards}
.kv{opacity:0;animation:reveal .42s var(--e) .14s forwards}
.rule{animation-delay:0s}
.lead{animation-delay:.07s}
h1{animation-delay:.07s}
.cta .btn{animation-delay:.21s}
.note{animation-delay:.28s}

@media (prefers-reduced-motion:reduce){
  .an,.kv{opacity:1;animation:none}
  .btn{transition:none}
  .btn:active{transform:none}
}

/* ---------- SP ---------- */
@media (max-width:900px){
  .hero{padding:34px 0 48px;background:linear-gradient(var(--paper) 0 30%,var(--paper2) 30% 100%)}
  .hd-in{height:60px}
  .hd-logo img{height:24px}
  .hd .btn{padding:10px 12px;font-size:12px}
  .lead{font-size:13px;margin-bottom:12px}
  h1{font-size:clamp(21px,5.6vw,30px);line-height:1.62}
  .kv{margin-top:26px}
  .kv::before{left:-7px;right:-7px;top:-7px;border-radius:50% 50% 10px 10px / 22% 22% 10px 10px}
  .kv-fig{height:clamp(400px,124vw,520px);border-radius:50% 50% 10px 10px / 22% 22% 10px 10px}
  .kv-fig img{object-position:50% 8%}
  .cta{margin-top:26px;width:100%}
  .btn-lg{width:100%;min-width:0;padding:18px 16px;font-size:16px}
  .note{font-size:12.5px}
}
@media (max-width:390px){
  .hd .btn{padding:9px 10px;font-size:11px}
  .hd-logo img{height:22px}
}
</style>
</head>
<body>

<header class="hd">
  <div class="wrap hd-in">
    <span class="hd-logo"><img src="../../../assets/img/index_lp/logo.svg" alt="ESL club"></span>
    <a class="btn" href="https://eslclub.jp/trial/">無料体験レッスンはこちら</a>
  </div>
</header>

<main>
  <section class="hero">
    <div class="wrap hero-in">
      <span class="rule an" aria-hidden="true"></span>
      <p class="lead an">2015年の開塾以降“英検に特化”してきたからできる</p>
      <h1 class="an">受験勉強と並走しながら<br>“<span class="nb">小学生・中学生で<span class="mk">英検2級</span></span>、<wbr><span class="nb">高校生で<span class="mk">準1級</span></span>”を<br>目指せる英語塾</h1>

      <div class="kv">
        <figure class="kv-fig">
          <picture>
            <source media="(min-width: 900.1px)" srcset="../../../lp/newonline/img/kv_big_pc.jpg">
            <img src="../../../lp/newonline/img/kv_big_sp.jpg" alt="ESL clubで学ぶ小学生と中高生のようす">
          </picture>
        </figure>
      </div>

      <div class="cta">
        <a class="btn btn-lg an" href="https://eslclub.jp/trial/">無料体験レッスンはこちら</a>
        <p class="note an">いつまでに2級合格できるかレッスン後にご案内します</p>
      </div>
    </div>
  </section>
</main>

</body>
</html>
