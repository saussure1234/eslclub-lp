<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESL club｜英検に特化した英語塾</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<style>
:root{
  --pad: max(20px, calc((100% - 1240px) / 2));
  --copy: clamp(340px, 30vw, 470px);
  --arch-x: clamp(96px, 14vw, 200px);
  --arch-y: clamp(140px, 25vw, 360px);
  --ink: #000000;
  --ink-sub: #333333;
  --line: #E3E3E3;
  --bg: #FFFFFF;
  --bg-soft: #F8F8F8;
  --green: #00B220;
  --green-hover: #05A81F;
  --green-pale: #EAF7EC;
  --orange: #FF9301;
  --marker: #FFE95C;
  --ease: cubic-bezier(.23,1,.32,1);
}

*{ box-sizing: border-box; }
html,body{ margin:0; padding:0; }
body{
  background: var(--bg);
  color: var(--ink);
  font-family: "Noto Sans JP", "Helvetica Neue", Helvetica, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Arial, "Yu Gothic", Meiryo, sans-serif;
  font-weight: 500;
  -webkit-font-smoothing: antialiased;
  line-height: 1.6;
  overflow-wrap: anywhere;
}
img{ max-width:100%; display:block; }
a{ color: inherit; text-decoration: none; }
h1,p,figure{ margin:0; }

:focus-visible{
  outline: 3px solid var(--orange);
  outline-offset: 3px;
  border-radius: 6px;
}

/* ---------- header ---------- */
.hd{
  border-bottom: 1px solid var(--line);
  background: var(--bg);
}
.hd__in{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px var(--pad);
  min-height: 62px;
}
.hd__logo img{ height: 26px; width: auto; }

/* ---------- button ---------- */
.btn{
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--green);
  color: #FFFFFF;
  border-radius: 6px;
  font-weight: 700;
  letter-spacing: .02em;
  white-space: nowrap;
  transition: background-color 180ms var(--ease), transform 140ms var(--ease);
}
.btn--sm{
  font-size: 11.5px;
  padding: 10px 12px;
}
.btn--lg{
  font-size: clamp(15px, 1.2vw + 6px, 19px);
  padding: 20px 28px;
  width: 100%;
  max-width: 400px;
  letter-spacing: .04em;
}
.btn:active{ transform: scale(.97); transition-duration: .12s; }
@media (hover:hover) and (pointer:fine){
  .btn:hover{ background: var(--green-hover); }
}

/* ---------- hero (base = stacked : text > photo > cta) ---------- */
.hero{
  display: grid;
  grid-template-columns: minmax(0,1fr);
  grid-template-areas:
    "copy"
    "media"
    "cta";
  row-gap: 26px;
  padding-block: 30px 0;
}
.hero__copy{
  grid-area: copy;
  padding-inline: var(--pad);
  max-width: 820px;
}
.hero__cta{
  grid-area: cta;
  padding-inline: var(--pad);
  padding-block: 4px 34px;
}
.hero__media{
  grid-area: media;
  position: relative;
  aspect-ratio: 1 / 1.12;
  border-top-left-radius: var(--arch-x) var(--arch-y);
  overflow: hidden;
  background: var(--bg-soft);
}
.hero__media picture{
  display: block;
  width: 100%;
  height: 100%;
}
.hero__media img{
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 12%;
}

/* lead */
.lead{
  font-size: clamp(13px, .6vw + 10px, 15px);
  font-weight: 700;
  color: var(--ink-sub);
  letter-spacing: .02em;
  line-height: 1.75;
}
.lead::before{
  content: "";
  display: block;
  width: 32px;
  height: 3px;
  margin-bottom: 12px;
  background: var(--orange);
  border-radius: 2px;
}

/* headline */
.ttl{
  margin-top: 16px;
  font-size: clamp(24px, 2.4vw + 12px, 37px);
  font-weight: 900;
  line-height: 1.62;
  letter-spacing: .005em;
  color: var(--ink);
}
.nb{ display: inline-block; white-space: nowrap; }
.mk{
  background: linear-gradient(transparent 58%, var(--marker) 58%, var(--marker) 94%, transparent 94%);
  padding-inline: 1px;
}

/* cta note */
.note{
  margin-top: 12px;
  font-size: clamp(12px, .5vw + 10px, 14px);
  font-weight: 500;
  color: var(--ink-sub);
  line-height: 1.7;
  max-width: 420px;
}

/* ---------- tablet / small desktop : full-bleed wide photo ---------- */
@media (min-width: 900.1px){
  .hd__logo img{ height: 30px; }
  .btn--sm{ font-size: 13px; padding: 12px 18px; }
  .hero{ row-gap: 34px; padding-block: 44px 0; }
  .hero__media{
    aspect-ratio: auto;
    height: clamp(560px, 52vw, 620px);
  }
  .hero__media img{ object-position: 36% 50%; }
}

/* ---------- desktop : right-bleed 2 columns ---------- */
@media (min-width: 1181px){
  .hero{
    grid-template-columns: minmax(0, calc(var(--pad) + var(--copy))) minmax(0, 1fr);
    grid-template-areas:
      "copy media"
      "cta  media";
    grid-template-rows: auto auto;
    column-gap: clamp(32px, 4vw, 64px);
    row-gap: 0;
    min-height: clamp(560px, 40vw, 600px);
    padding-block: 0;
  }
  .hero__copy{
    align-self: end;
    padding-block: 40px 20px;
    padding-inline: var(--pad) 0;
    max-width: none;
  }
  .hero__cta{
    align-self: start;
    padding-block: 0 40px;
    padding-inline: var(--pad) 0;
  }
  .hero__media{
    grid-row: 1 / -1;
    height: 100%;
    min-height: clamp(560px, 40vw, 600px);
    overflow: visible;
  }
  .hero__media::before{
    content: "";
    position: absolute;
    inset: 0 0 -14px -14px;
    background: var(--green-pale);
    border-top-left-radius: var(--arch-x) var(--arch-y);
    z-index: 0;
  }
  .hero__media img{
    position: relative;
    z-index: 1;
    border-top-left-radius: var(--arch-x) var(--arch-y);
  }
  .ttl{
    margin-top: 20px;
    font-size: clamp(24px, 2.15vw, 37px);
  }
  .note{ margin-top: 14px; }
}

/* ---------- entrance orchestration ---------- */
@keyframes rise{
  from{ opacity: 0; transform: translateY(14px); }
  to{ opacity: 1; transform: none; }
}
@keyframes reveal{
  from{ opacity: 0; transform: scale(.985); }
  to{ opacity: 1; transform: none; }
}
.a1,.a2,.a3,.a4,.a5{ animation: rise 280ms var(--ease) both; }
.a1{ animation-delay: 0ms; }
.a2{ animation-delay: 70ms; }
.a3{ animation-delay: 140ms; }
.a4{ animation-delay: 210ms; }
.a5{ animation-delay: 280ms; }
.am{
  animation: reveal 280ms var(--ease) both;
  animation-delay: 140ms;
  transform-origin: 100% 50%;
}

@media (prefers-reduced-motion: reduce){
  .a1,.a2,.a3,.a4,.a5,.am{ animation: none; }
  .btn{ transition: none; }
  .btn:active{ transform: none; }
}
</style>
</head>
<body>

<header class="hd a1">
  <div class="hd__in">
    <a class="hd__logo" href="https://eslclub.jp/"><img src="../../../assets/img/index_lp/logo.svg" alt="ESL club" width="208" height="38"></a>
    <a class="btn btn--sm" href="https://eslclub.jp/trial/">無料体験レッスンはこちら</a>
  </div>
</header>

<main>
  <section class="hero">

    <div class="hero__copy">
      <p class="lead a2">2015年の開塾以降“英検に特化”してきたからできる</p>
      <h1 class="ttl a3"><span class="nb">受験勉強と並走しながら</span><wbr><span class="nb">“小学生・中学生で</span><wbr><span class="nb"><span class="mk">英検2級</span>、</span><wbr><span class="nb">高校生で<span class="mk">準1級</span>”を</span><wbr><span class="nb">目指せる英語塾</span></h1>
    </div>

    <figure class="hero__media am">
      <picture>
        <source media="(min-width: 900.1px)" srcset="../../../lp/newonline/img/kv_big_pc.jpg">
        <img src="../../../lp/newonline/img/kv_big_sp.jpg" alt="ESL clubで学ぶ小学生と中高生のようす" width="750" height="1118">
      </picture>
    </figure>

    <div class="hero__cta">
      <a class="btn btn--lg a4" href="https://eslclub.jp/trial/">無料体験レッスンはこちら</a>
      <p class="note a5">いつまでに2級合格できるかレッスン後にご案内します</p>
    </div>

  </section>
</main>

</body>
</html>
