<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>受験勉強と並走しながら小学生・中学生で英検2級、高校生で準1級を目指せる英語塾｜ESL club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* =========================================================
   ESL club LP v2 / FV
   使用してよいもの：eslclub.jp の「色」と「フォント」のみ
   デザイン（構成・形・装飾）は本ファイルで新規に設計する
   ========================================================= */
:root{
  /* --- 色：eslclub.jp 実測値のみ --- */
  --green:#00B220;
  --green-d:#05A81F;
  --orange:#FF9301;
  --ink:#000000;
  --ink2:#333333;
  --ink3:#707070;
  --bg:#FFFFFF;
  --bg2:#F8F8F8;
  --line:#E3E3E3;
  /* --- 型スケール --- */
  --fs-note:12px; --fs-sm:13px; --fs-base:15px; --fs-md:17px;
  --fs-lg:21px; --fs-xl:28px; --fs-2xl:38px; --fs-3xl:50px;
  /* --- 余白スケール --- */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:36px; --s7:52px; --s8:76px;
  --r:6px;
  --e:cubic-bezier(.23,1,.32,1);
  --font:"Noto Sans JP","Helvetica Neue",Helvetica,"Hiragino Sans","Hiragino Kaku Gothic ProN",Arial,"Yu Gothic",Meiryo,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.9;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
:where(a,button):focus-visible{outline:3px solid var(--green);outline-offset:3px;border-radius:var(--r)}
.wrap{max-width:1180px;margin:0 auto;padding:0 var(--s5)}
.nb{white-space:nowrap}

/* ---------------- ボタン ---------------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s3);
  background:var(--green);color:#fff;font-weight:700;font-size:var(--fs-md);
  padding:19px 38px;border-radius:var(--r);letter-spacing:.02em;
  transition:background .16s var(--e),transform .16s var(--e)}
.btn .arw{width:22px;height:10px;flex:none}
.btn .arw svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8}
.btn:active{transform:scale(.98)}
@media(hover:hover) and (pointer:fine){.btn:hover{background:var(--green-d)}}
.btn--sm{padding:12px 24px;font-size:var(--fs-sm)}

/* ---------------- ヘッダー ---------------- */
.hd{position:relative;z-index:5;background:var(--bg)}
.hd__in{display:flex;align-items:center;justify-content:space-between;height:78px}
.hd__logo img{height:32px;width:auto}

/* ---------------- FV ---------------- */
.fv{display:flex;flex-direction:column;min-height:calc(100vh - 78px)}

/* 上段：文字だけ（確実に読ませる） */
.fv__copy{flex:1 1 auto;display:flex;align-items:center;padding:var(--s7) 0 var(--s6)}
.fv__eyebrow{display:flex;align-items:center;gap:var(--s3);margin:0 0 var(--s5);
  font-size:var(--fs-base);font-weight:700;color:var(--ink2);letter-spacing:.02em}
.fv__eyebrow::before{content:"";width:34px;height:3px;background:var(--green);flex:none;border-radius:2px}
.fv h1{margin:0;font-weight:900;letter-spacing:.004em}
.fv h1 .l1{display:block;font-size:clamp(19px,2.1vw,var(--fs-xl));color:var(--ink2);margin-bottom:var(--s2)}
.fv h1 .l2{display:block;font-size:clamp(30px,4.2vw,var(--fs-3xl));line-height:1.44}
.fv h1 em{font-style:normal;color:var(--green-d)}
.fv__row{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s7);flex-wrap:wrap;margin-top:var(--s6)}
.fv__cta{display:flex;flex-direction:column;gap:var(--s3)}
.fv__cta p{margin:0;font-size:var(--fs-sm);color:var(--ink3)}
/* 数字（証拠） */
.facts{display:flex;gap:var(--s7)}
.fact b{display:block;font-weight:900;font-size:clamp(28px,3vw,42px);line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.fact b i{font-style:normal;font-size:.42em;margin-left:3px}
.fact span{display:block;margin-top:var(--s2);font-size:var(--fs-sm);font-weight:700;color:var(--ink2)}

/* 下段：写真の帯（2レーンが斜めの継ぎ目で並走する） */
.lanes{position:relative;width:100%;height:clamp(280px,42vh,420px);overflow:hidden;background:var(--bg2)}
.lanes figure{position:absolute;inset:0;margin:0}
.lanes img{width:100%;height:100%;object-fit:cover}
.lanes .lane-a{clip-path:polygon(0 0, 51.5% 0, 45.5% 100%, 0 100%)}
.lanes .lane-b{clip-path:polygon(53.5% 0, 100% 0, 100% 100%, 47.5% 100%)}
.lanes .lane-a img{object-position:52% 34%}
.lanes .lane-b img{object-position:60% 42%}
.fv__foot{padding:var(--s4) 0 var(--s6);font-size:var(--fs-note);color:var(--ink3);line-height:1.85}

@media(max-width:900px){
  .fv{min-height:0}
  .fv__copy{padding:var(--s6) 0 var(--s5)}
  .fv__row{gap:var(--s5)}
  .facts{gap:var(--s6)}
  .lanes{height:clamp(220px,34vh,300px)}
}
</style>
</head>
<body>

<header class="hd">
  <div class="wrap hd__in">
    <p class="hd__logo" style="margin:0"><a href="https://eslclub.jp"><img src="../assets/img/index_lp/logo.svg" alt="ESL club"></a></p>
    <a class="btn btn--sm" href="https://eslclub.jp/trial/">無料体験レッスンはこちら</a>
  </div>
</header>

<section class="fv">

  <div class="fv__copy">
    <div class="wrap">
      <p class="fv__eyebrow">2015年の開塾以降“英検に特化”してきたからできる</p>

      <h1>
        <span class="l1">受験勉強と並走しながら</span>
        <span class="l2"><span class="nb">小学生・中学生で<em>英検2級</em>、</span><br><span class="nb">高校生で<em>準1級</em>を目指せる英語塾</span></span>
      </h1>

      <div class="fv__row">
        <div class="facts">
          <div class="fact"><b>1,000<i>名以上</i></b><span>累計の合格実績</span></div>
          <div class="fact"><b>75<i>%</i></b><span>小中学生の英検2級 合格率</span></div>
        </div>
        <div class="fv__cta">
          <a class="btn" href="https://eslclub.jp/trial/">無料体験レッスンはこちら
            <span class="arw"><svg viewBox="0 0 22 10"><path d="M0 5h19M15 1l4 4-4 4"/></svg></span>
          </a>
          <p>いつまでに2級合格できるかレッスン後にご案内します</p>
        </div>
      </div>
    </div>
  </div>

  <div class="lanes">
    <figure class="lane-a"><img src="../lp/newonline/img/kv_a.jpg" alt="自宅で英作文に取り組む小学生"></figure>
    <figure class="lane-b"><img src="../lp/newonline/img/kv_b.jpg" alt="オンラインで英検2級の学習をする中高生"></figure>
  </div>

  <div class="wrap"><p class="fv__foot">※合格率は2023年度第2回の実績（ESL clubオンライン校）／受験者のうち1次・2次受験双方に合格した生徒の割合</p></div>

</section>

</body>
</html>
